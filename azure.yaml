# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: todo-csharp-cosmos-sql
metadata:
  template: todo-csharp-cosmos-sql@0.0.1-beta

# Infrastructure as Code: Bicep templates under infra/ (main.bicep + modules)
infra:
  provider: bicep
  path: ./infra

workflows:
  up: 
    steps:
      - azd: provision
      - azd: deploy --all
services:
  web:
    project: ./src/web
    dist: dist
    language: js
    host: appservice
    hooks:
      # Creates a temporary `.env.local` file for the build command. Vite will automatically use it during build.
      # The expected/required values are mapped to the infrastructure outputs.
      # .env.local is ignored by git, so it will not be committed if, for any reason, if deployment fails.
      # see: https://vitejs.dev/guide/env-and-mode
      # Note: Notice that dotenv must be a project dependency for this to work. See package.json.
      prepackage:
        windows:
          shell: pwsh
          run: 'echo "VITE_API_BASE_URL=""$env:API_BASE_URL""" > .env.local ; echo "VITE_APPLICATIONINSIGHTS_CONNECTION_STRING=""$env:APPLICATIONINSIGHTS_CONNECTION_STRING""" >> .env.local ; echo "VITE_MSAL_CLIENT_ID=""a1a93d2b-a191-4290-bf03-f75c2b154671""" >> .env.local ; echo "VITE_MSAL_AUTHORITY=""https://login.microsoftonline.com/adb53b4f-b05f-4dcb-a2e1-9111380568c3/v2.0""" >> .env.local ; echo "VITE_MSAL_API_SCOPES=""api://84775fba-0812-4e8a-8e63-d2eaf8afbbae/access_as_user""" >> .env.local'
        posix:
          shell: sh
          run: 'echo VITE_API_BASE_URL=\"$API_BASE_URL\" > .env.local && echo VITE_APPLICATIONINSIGHTS_CONNECTION_STRING=\"$APPLICATIONINSIGHTS_CONNECTION_STRING\" >> .env.local && echo VITE_MSAL_CLIENT_ID=\"a1a93d2b-a191-4290-bf03-f75c2b154671\" >> .env.local && echo VITE_MSAL_AUTHORITY=\"https://login.microsoftonline.com/adb53b4f-b05f-4dcb-a2e1-9111380568c3/v2.0\" >> .env.local && echo VITE_MSAL_API_SCOPES=\"api://84775fba-0812-4e8a-8e63-d2eaf8afbbae/access_as_user\" >> .env.local'
      postdeploy:
        windows:
          shell: pwsh
          run: 'rm .env.local'
        posix:
          shell: sh
          run: 'rm .env.local'
  api:
    project: ./src/api
    language: csharp
    host: appservice
