# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: todo-csharp-cosmos-sql
metadata:
  template: todo-csharp-cosmos-sql@0.0.1-beta

# -----------------------------------------------------------------------------
# Platform resources (all provisioned by `azd provision`; source: infra/main.bicep + modules)
#
#   • Resource group — environment-scoped naming (see infra/abbreviations.json)
#   • Log Analytics workspace + Application Insights — monitoring; connection string output for web build + app settings
#   • Azure Key Vault — secrets; RBAC: API managed identity (Secrets User), deployment principal (optional Secrets Officer)
#   • Azure Cosmos DB (SQL API) — account + database; API managed identity: Cosmos DB Built-in Data Contributor
#   • App Service Plan (Linux) + Web App (Node 20, React SPA) + API App Service (.NET 8)
#       — Cosmos endpoint/database in API app settings; CORS includes web hostname; Key Vault name for API
#   • Azure Cache for Redis — API App Service gets ConnectionStrings__Redis (StackExchange.Redis); REDIS_HOST/PORT outputs for reference
#   • Optional: Azure API Management — when useAPIM=true; API_BASE_URL output targets gateway
#
# Deployable azd services below (web, api) map to the App Service apps; all other rows are infra-only.
# -----------------------------------------------------------------------------

# Infrastructure as Code: entry is infra/main.bicep (subscription scope); modules under infra/modules, infra/app
infra:
  provider: bicep
  path: ./infra

workflows:
  up: 
    steps:
      - azd: provision
      - azd: deploy --all
services:
  web:
    project: ./src/web
    dist: dist
    language: js
    host: appservice
    hooks:
      # Creates a temporary `.env.local` for `npm run build`. Vite loads it automatically.
      # API_BASE_URL and APPLICATIONINSIGHTS_* come from Bicep outputs (azd injects during packaging).
      # VITE_MSAL_* must be set per environment: `azd env set VITE_MSAL_CLIENT_ID ...` or shell/CI env (see docs/auth-msal.md).
      # Without VITE_MSAL_CLIENT_ID the SPA build has auth disabled. .env.local is gitignored.
      # see: https://vitejs.dev/guide/env-and-mode
      prepackage:
        windows:
          shell: pwsh
          run: |
            @(
              "VITE_API_BASE_URL=$($env:API_BASE_URL)",
              "VITE_APPLICATIONINSIGHTS_CONNECTION_STRING=$($env:APPLICATIONINSIGHTS_CONNECTION_STRING)",
              "VITE_MSAL_CLIENT_ID=$($env:VITE_MSAL_CLIENT_ID)",
              "VITE_MSAL_AUTHORITY=$($env:VITE_MSAL_AUTHORITY)",
              "VITE_MSAL_REDIRECT_URI=$($env:VITE_MSAL_REDIRECT_URI)",
              "VITE_MSAL_POST_LOGOUT_REDIRECT_URI=$($env:VITE_MSAL_POST_LOGOUT_REDIRECT_URI)",
              "VITE_MSAL_API_SCOPES=$($env:VITE_MSAL_API_SCOPES)"
            ) | Set-Content -Path .env.local -Encoding utf8
        posix:
          shell: sh
          run: |
            {
              echo "VITE_API_BASE_URL=$API_BASE_URL"
              echo "VITE_APPLICATIONINSIGHTS_CONNECTION_STRING=$APPLICATIONINSIGHTS_CONNECTION_STRING"
              echo "VITE_MSAL_CLIENT_ID=${VITE_MSAL_CLIENT_ID:-}"
              echo "VITE_MSAL_AUTHORITY=${VITE_MSAL_AUTHORITY:-}"
              echo "VITE_MSAL_REDIRECT_URI=${VITE_MSAL_REDIRECT_URI:-}"
              echo "VITE_MSAL_POST_LOGOUT_REDIRECT_URI=${VITE_MSAL_POST_LOGOUT_REDIRECT_URI:-}"
              echo "VITE_MSAL_API_SCOPES=${VITE_MSAL_API_SCOPES:-}"
            } > .env.local
      postdeploy:
        windows:
          shell: pwsh
          run: 'rm .env.local'
        posix:
          shell: sh
          run: 'rm .env.local'
  api:
    project: ./src/api
    language: csharp
    host: appservice
