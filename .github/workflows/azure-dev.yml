name: Azure Dev CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore src/api/Todo.Api.sln

      - name: Build
        run: dotnet build src/api/Todo.Api.sln --no-restore -c Release

      # WO-1: FastLocal on PR (fast gate); full suite on push to main and workflow_dispatch
      - name: Run tests
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Running FastLocal tests only (Category=FastLocal)"
            dotnet test src/api/Todo.Api.sln --no-build -c Release --verbosity normal --filter "Category=FastLocal"
          else
            echo "Running full test suite"
            dotnet test src/api/Todo.Api.sln --no-build -c Release --verbosity normal
          fi

  build-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/web

      - name: TypeScript type check
        run: npm run typecheck
        working-directory: src/web

      - name: ESLint
        run: npm run lint
        working-directory: src/web

      - name: Unit tests
        run: npm run test
        working-directory: src/web

      - name: Build
        run: npm run build
        working-directory: src/web

  validate-infrastructure:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Bicep templates
        run: az bicep build --file infra/main.bicep

  deploy:
    name: Provision & Deploy
    if: github.event_name != 'pull_request'
    needs: [build-backend, build-frontend, validate-infrastructure]
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure (Federated Credentials)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Log in with Azure (Client Credentials)
        if: ${{ env.AZURE_CLIENT_ID == '' }}
        run: |
          echo "$AZURE_CREDENTIALS" > creds.json
          CLIENT_ID=$(jq -r .clientId creds.json)
          CLIENT_SECRET=$(jq -r .clientSecret creds.json)
          TENANT_ID=$(jq -r .tenantId creds.json)
          rm creds.json
          echo "::add-mask::$CLIENT_SECRET"
          azd auth login \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --tenant-id "$TENANT_ID"
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      # Bicep (infra/main.bicep): App Service plan + Linux Web App (React) + Linux API App Service,
      # Cosmos DB, Key Vault, Redis, Application Insights, RBAC, optional APIM.
      - name: Provision infrastructure (Web App + API + data plane)
        run: azd provision --no-prompt
        env:
          AZD_INITIAL_ENVIRONMENT_CONFIG: ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}

      # Deploys azure.yaml services: web → Web App, api → API App Service (zip deploy).
      # Set repository variables VITE_MSAL_* so the web prepackage hook can bake MSAL into the Vite build (see docs/auth-msal.md).
      - name: Deploy application (web + api)
        run: azd deploy --no-prompt
        env:
          VITE_MSAL_CLIENT_ID: ${{ vars.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_AUTHORITY: ${{ vars.VITE_MSAL_AUTHORITY }}
          VITE_MSAL_REDIRECT_URI: ${{ vars.VITE_MSAL_REDIRECT_URI }}
          VITE_MSAL_POST_LOGOUT_REDIRECT_URI: ${{ vars.VITE_MSAL_POST_LOGOUT_REDIRECT_URI }}
          VITE_MSAL_API_SCOPES: ${{ vars.VITE_MSAL_API_SCOPES }}

      # WO-2: fail the workflow if the deployed API does not respond on liveness
      - name: Smoke test — API /health/live
        run: |
          set -euo pipefail
          line=$(azd env get-values | grep -E '^API_BASE_URL=' | head -1 || true)
          if [ -z "${line}" ]; then
            echo "::error::API_BASE_URL not found in azd environment (run azd provision and ensure Bicep outputs API_BASE_URL)"
            azd env get-values || true
            exit 1
          fi
          API_BASE_URL="${line#API_BASE_URL=}"
          URL="${API_BASE_URL%/}/health/live"
          echo "GET $URL"
          curl -fsS -o /dev/null --connect-timeout 30 --max-time 60 "$URL"
          echo "Smoke test passed (HTTP 2xx)"
