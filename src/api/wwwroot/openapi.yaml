openapi: 3.0.0
info:
  description: Minimal scaffold API
  version: 1.0.0
  title: Backend API
  contact:
    email: azdevteam@microsoft.com

paths:
  /:
    get:
      operationId: GetRoot
      summary: Root endpoint
      responses:
        200:
          description: OK
  /health:
    get:
      operationId: GetHealth
      summary: Health check
      responses:
        200:
          description: OK
  /health/live:
    get:
      operationId: GetHealthLive
      summary: Liveness probe (no external dependencies)
      responses:
        200:
          description: Healthy
        503:
          description: Unhealthy
  /health/ready:
    get:
      operationId: GetHealthReady
      summary: Readiness probe (Cosmos DB and Redis when configured)
      responses:
        200:
          description: All dependencies healthy
        503:
          description: One or more dependencies unhealthy
  /api/v1/me/tenant-context:
    get:
      operationId: GetMeTenantContext
      summary: Current user tenant context (WO-6)
      description: Requires Bearer JWT and X-Tenant-Id; validates tenant and user role assignment.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Resolved tenant id, role, and assignment status
        400:
          description: Missing or empty X-Tenant-Id
        403:
          description: No access to tenant or inactive tenant/assignment
        404:
          description: Tenant not found
        503:
          description: Cosmos repositories not configured
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
